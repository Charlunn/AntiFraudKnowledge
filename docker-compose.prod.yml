services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.backend
    env_file:
      - ./config/.env.production
    ports:
      - "8000:8000"
    networks:
      - prod_network
    depends_on:
      - mysql
      - neo4j

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.frontend
    env_file:
      - ./config/.env.production
    ports:
      - "3000:3000"
    networks:
      - prod_network
    depends_on:
      - backend

  neo4j:
    image: neo4j:latest
    volumes:
      - neo4j_data:/data
    ports:
      - "7474:7474"
      - "7687:7687"
    networks:
      - prod_network
    env_file:
      - ./config/.env.production

  mysql:
    image: mysql:8
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"
    networks:
      - prod_network
    env_file:
      - ./config/.env.production

networks:
  prod_network:
    driver: bridge

volumes:
  mysql_data:
  neo4j_data:
