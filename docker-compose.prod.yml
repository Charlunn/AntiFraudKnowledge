services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.backend
    env_file:
      - ./config/.env.production
    ports:
      - "8000:8000"
    networks:
      - prod_network
    depends_on:
      - postgres
      - neo4j

  frontend:
    image: node:18
    working_dir: /app
    env_file:
      - ./config/.env.production
    environment:
      API_BASE_SERVER: http://backend:8000
      API_PROXY_TARGET: http://backend:8000
      API_BASE_CLIENT: /api
      NUXT_PUBLIC_API_BASE: /api
      DOCKER_ENV: "true"
    volumes:
      - ./frontend:/app
    command: npm run build && npm run preview
    ports:
      - "3000:3000"
    networks:
      - prod_network
    depends_on:
      - backend

  neo4j:
    image: neo4j:latest
    volumes:
      - neo4j_data:/data
    ports:
      - "7474:7474"
      - "7687:7687"
    networks:
      - prod_network
    env_file:
      - ./config/.env.production

  postgres:
    image: postgres:15
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - prod_network
    env_file:
      - ./config/.env.production

networks:
  prod_network:
    driver: bridge

volumes:
  postgres_data:
  neo4j_data:
