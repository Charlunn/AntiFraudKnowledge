services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.backend
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    networks:
      - dev_network
    env_file:
      - ./config/.env
    depends_on:
      - postgres
      - neo4j

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.frontend
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_pnpm_store:/pnpm/store
    ports:
      - "3000:3000"
    networks:
      - dev_network
    environment:
      - CHOKIDAR_USEPOLLING=true
      - DOCKER_ENV=true
      - CI=true
      - NUXT_HOST=0.0.0.0
      - PNPM_STORE_PATH=/pnpm/store
    command: ["sh", "-c", "pnpm install --prefer-offline --frozen-lockfile && pnpm run dev"]

  neo4j:
    image: neo4j:latest
    volumes:
      - ./db/neo4j:/data
    ports:
      - "7474:7474"
      - "7687:7687"
    networks:
      - dev_network
    env_file:
      - ./config/.env

  postgres:
    image: postgres:15
    volumes:
      - ./db/postgres:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - dev_network
    env_file:
      - ./config/.env

networks:
  dev_network:
    driver: bridge

volumes:
  frontend_node_modules:
  frontend_pnpm_store:


